/* ═══════════════════════════════════════════════════════════════

      O motor abaixo interpreta estas estruturas; nenhuma regra de

   ═══════════════════════════════════════════════════════════════ */

const CONFIG = {
  target_titles: ["CIO", "CTO", "Diretor de TI", "Diretor de Tecnologia", "Head de Transformação Digital", "Gerente de TI"],
  seniority_order: ["c_suite", "vp", "director", "head", "manager"],
  max_contacts_per_company: 3,
  guessed_email_ttl_days: 7,
  match_timeout_hours: 48,
  validation_freshness_days: 30,
  salesnav_monthly_update_limit: 1000,
  apollo_credit_alert_pct: 80
};

const STATE_MACHINE = {
  initial: "NOVO",
  transitions: {
    NOVO:          ["ENRIQUECIDO", "EMPRESA_NAO_ENCONTRADA", "SEM_EMAIL"],
    ENRIQUECIDO:   ["EM_VALIDACAO", "SEM_EMAIL"],
    EM_VALIDACAO:  ["VALIDADO", "INVALIDO_SAIU_EMPRESA", "REVISAO_MANUAL"],
    VALIDADO:      ["EM_CADENCIA", "INVALIDO_SAIU_EMPRESA"],
    EM_CADENCIA:   ["RESPONDEU", "SEM_RESPOSTA", "INVALIDO_BOUNCE", "INVALIDO_SAIU_EMPRESA"]
  }

/* ═══════════════════════════════════════════════════════════════
   2. MOTOR DE REGRAS — espelha src/sdr/rules_engine.py
   ═══════════════════════════════════════════════════════════════ */

const OPS = {
  eq:  (a, b) => a === b,
  neq: (a, b) => a !== b,
  gt:  (a, b) => a != null && a > b,
  gte: (a, b) => a != null && a >= b,
  lt:  (a, b) => a != null && a < b,
  lte: (a, b) => a != null && a <= b,
  not_empty: (a) => Array.isArray(a) ? a.length > 0 : Boolean(a)
};

function resolveValue(v) {
  if (typeof v === "string") {
    const m = v.match(/^\$\{config\.([a-z_]+)\}$/);
    if (m) return CONFIG[m[1]];
  }
  return v;
}

const ORDERED_RULES = [...RULES].sort((a, b) =>
  (a.priority === "highest" ? 0 : 1) - (b.priority === "highest" ? 0 : 1));

function checkCond(cond, facts) {
  if (!(cond.field in facts)) return false;
  return OPS[cond.op](facts[cond.field], resolveValue(cond.value));
}

function toDecision(rule, branch, matched) {
  const actions = branch.map(a => a.action);
  const setStatus = branch.find(a => a.action === "set_status");
  return { rule_id: rule.id, matched, actions, raw: branch, new_status: setStatus ? setStatus.value : null };
}

/** Avalia todas as regras contra um dicionário de fatos com chaves pontilhadas. */
function evaluate(facts) {
  const out = [];
  for (const rule of ORDERED_RULES) {
    const matched = rule.when.every(c => checkCond(c, facts));
    const branch = matched ? rule.then : rule.else;
    if (!branch) continue;
    if (!matched && !rule.when.every(c => c.field in facts)) continue; // gate só se os fatos existem
    out.push(toDecision(rule, branch, matched));
  }
  return out;
}

function canTransition(from, to) {
  return (STATE_MACHINE.transitions[from] || []).includes(to);
}

function seniorityRank(title) {
  const kw = { c_suite: ["cio", "cto", "ceo", "chief"], vp: ["vp", "vice"], director: ["diretor", "director", "diretora"], head: ["head"], manager: ["gerente", "manager"] };
  const t = nrm(title);
  for (let i = 0; i < CONFIG.seniority_order.length; i++) {
    const level = CONFIG.seniority_order[i];
    if ((kw[level] || []).some(k => t.includes(k))) return i;
  }
  return CONFIG.seniority_order.length;
}
/* Neutraliza a flexão de gênero antes de comparar cargos: "Diretora de
   Tecnologia" precisa casar com o alvo "Diretor de Tecnologia". O
   pipeline.py atual usa `target.lower() in title.lower()` e por isso
   descarta silenciosamente cargos no feminino — divergência intencional
   deste mockup, anotada no README. */
const degender = s => nrm(s).replace(/ora\b/g, "or");

function titleMatches(title) {
  const t = degender(title);
  return CONFIG.target_titles.some(target => t.includes(degender(target)));
}

/* Aplica uma transição respeitando a máquina de estados. */
function transition(c, target, ruleId, text) {
  if (!canTransition(c.status, target)) {
    log("error", ruleId, `Transição inválida ${c.status} → ${target} bloqueada (${c.first_name} ${c.last_name})`);
    return false;
  }
  c.status = target;
  c.trace.push({ at: now(), rule: ruleId, text: text || `Status → ${target}` });
  log("info", ruleId, `${c.first_name} ${c.last_name} → ${target}`);
  return true;
}

function createTask(type, contactId, ruleId, slaHours) {
  DB.tasks.push({ id: "t" + (++SEQ), type, contact_id: contactId, rule: ruleId, created_at: now(), sla_hours: slaHours || null, done: false });
  log("info", ruleId, `Tarefa criada: ${type}`);
}

/* Verifica R6.1 / R6.2 a partir das quotas atuais. */
function checkQuotas() {
  const facts = {
    "quota.apollo_credits_used_pct": pct(DB.quotas.apollo.used, DB.quotas.apollo.total),
    "quota.salesnav_updates_month": DB.quotas.salesnav.used
  };
  const fired = evaluate(facts).filter(d => d.matched);
  for (const d of fired) {
    if (d.actions.includes("pause_pipeline")) {
      DB.pipelinePaused = true;
      log("critical", d.rule_id, "Limite mensal do Sales Navigator atingido — pipeline pausado");
    } else {
      log("warning", d.rule_id, `Notificação Teams: consumo Apollo em ${facts["quota.apollo_credits_used_pct"]}%`);
    }
  }
  return fired;
}

async function runProspect(name, forcedMatch) {
  const p = prospectState;
  p.running = true; p.steps = []; p.result = null; p.pending = null;
  const credits0 = DB.quotas.apollo.used;
  render();

  const push = async (step, delay) => { p.steps.push(step); render(); await sleep(delay == null ? 420 : delay); };

  // 1. Resolução da empresa (Apollo /mixed_companies/search)
  const matches = forcedMatch ? [forcedMatch] : COMPANY_INDEX.filter(c => nrm(c.name).includes(nrm(name)));
  await push({ title: `Apollo · resolve_company("${name}")`, detail: `<span class="mono">POST /api/v1/mixed_companies/search</span> — ${matches.length} correspondência(s)` });

  const resolveDecisions = evaluate({ "company.match_count": forcedMatch ? 1 : matches.length }).filter(d => d.matched);

  if (resolveDecisions.some(d => d.actions.includes("stop_pipeline"))) {
    await push({ rule: "R1.2", title: "Empresa não encontrada", tone: "bad", badge: "stop_pipeline",
      detail: `Status <span class="mono">EMPRESA_NAO_ENCONTRADA</span>, notificação enviada ao Teams e pipeline encerrado. Nenhum crédito Apollo consumido.` });
    log("warning", "R1.2", `Empresa não encontrada: ${name}`);
    DB.runs.unshift({ at: now(), company: name, outcome: statusChip("EMPRESA_NAO_ENCONTRADA"), candidates: 0, saved: 0, credits: 0 });
    p.running = false; render(); return;
  }

  if (resolveDecisions.some(d => d.actions.includes("require_domain_confirmation"))) {
    await push({ rule: "R1.1", title: "Confirmação de domínio exigida", tone: "warn", badge: "aguardando humano",
      detail: `${matches.length} empresas com nome parecido. O pipeline pausa aqui — enriquecer sem confirmar desperdiça crédito.` });
    log("warning", "R1.1", `Empresa ambígua (${matches.length} matches): ${name}`);
    p.pending = { name, matches }; p.running = false; render(); return;
  }

  const match = matches[0];
  await push({ title: `Dynamics · upsert de conta`, detail: `<span class="mono">PATCH /accounts(new_apollo_org_id='${esc(match.domain.split(".")[0])}')</span> — ${esc(match.name)} · ${esc(match.domain)}` });

  // 2. Busca de candidatos (sem consumir crédito)
  const pool = CANDIDATE_POOLS[match.name] || CANDIDATE_POOLS._default;
  await push({ title: `Apollo · search_people`, detail: `<span class="mono">POST /api/v1/mixed_people/search</span> — ${pool.length} candidato(s), sem consumo de crédito` });

  // 3. R2.1 filtro de cargo
  const kept = [], dropped = [];
  for (const cand of pool) {
    const d = evaluate({ "contact.title_matched": titleMatches(cand.title) }).filter(x => x.matched);
    (d.some(x => x.actions.includes("discard_candidate")) ? dropped : kept).push(cand);
  }
  await push({ rule: "R2.1", title: `Filtro de cargo: ${kept.length} de ${pool.length} aprovados`,
    detail: dropped.length ? `Descartados: ${dropped.map(c => `<span class="mono">${esc(c.title)}</span>`).join(", ")}` : "Todos os cargos estão na lista alvo." });

  // 4. R2.3 ordenação por senioridade
  kept.sort((a, b) => seniorityRank(a.title) - seniorityRank(b.title));
  await push({ rule: "R2.3", title: "Ordenação por senioridade",
    detail: kept.map(c => `<span class="mono">${esc(c.title)}</span>`).join(" › ") });

  // 5. R2.2 limite por empresa
  const selected = [], overflow = [];
  for (const cand of kept) {
    const d = evaluate({ "company.selected_count": selected.length }).filter(x => x.matched);
    (d.some(x => x.actions.includes("discard_candidate")) ? overflow : selected).push(cand);
  }
  await push({ rule: "R2.2", title: `Limite de ${CONFIG.max_contacts_per_company} contatos por empresa`,
    detail: overflow.length ? `Fora do corte: ${overflow.map(c => `${esc(c.first)} ${esc(c.last)}`).join(", ")}` : "Nenhum candidato excedente." });

  // 6. Enriquecimento — só depois dos filtros (CLAUDE.md)
  let co = DB.companies.find(c => c.name === match.name);
  if (!co) {
    co = { id: "co" + (++SEQ), apollo_org_id: "5f3a" + SEQ, name: match.name, domain: match.domain, employees: match.employees, industry: match.industry };
    DB.companies.push(co);
  }

  const created = [];
  for (const cand of selected) {
    DB.quotas.apollo.used += 1;
    const slug = nrm(cand.first + "." + cand.last).replace(/\s+/g, "");
    const c = addContact({
      company_id: co.id, first_name: cand.first, last_name: cand.last, title: cand.title,
      email_status: cand.email_status, email: cand.email_status === "unavailable" ? null : slug + "@" + co.domain,
      linkedin_url: "linkedin.com/in/" + slug, created_at: now(), enriched_at: now(),
      trace: [{ at: now(), rule: "—", text: "Criado a partir do Apollo (people/match)" }]
    });
    transition(c, "ENRIQUECIDO", "—", "Enriquecido pelo Apollo");

    // R3 — qualidade de e-mail
    const decisions = evaluate({
      "contact.email_status": c.email_status,
      "contact.days_since_enrichment": 0
    }).filter(d => d.matched);

    let applied = "—", tone = "", badge = "";
    for (const d of decisions) {
      if (d.new_status && canTransition(c.status, d.new_status)) {
        transition(c, d.new_status, d.rule_id);
        applied = d.rule_id;
      }
      if (d.actions.includes("create_task")) {
        createTask("linkedin_manual_outreach", c.id, d.rule_id);
        applied = d.rule_id;
      }
    }
    if (c.email_status === "guessed") { tone = "warn"; badge = `pendente até ${CONFIG.guessed_email_ttl_days}d`; }
    if (c.status === "EM_VALIDACAO") { tone = "ok"; badge = "segue para validação"; }
    if (c.status === "SEM_EMAIL") { tone = "bad"; badge = "tarefa manual criada"; }

    created.push(c);
    await push({ rule: applied, title: `${cand.first} ${cand.last} — ${cand.title}`, tone, badge,
      detail: `<span class="mono">people/match</span> · e-mail <span class="mono">${esc(c.email_status)}</span> · gravado em <span class="mono">contact(${esc(c.dynamics_contact_id)})</span> como <span class="mono">${esc(c.status)}</span>` }, 300);
  }

  const quotaFired = checkQuotas();
  if (quotaFired.length) {
    await push({ rule: quotaFired[0].rule_id, title: "Limiar de quota atingido", tone: "warn", badge: "notify: teams",
      detail: `Consumo Apollo em ${pct(DB.quotas.apollo.used, DB.quotas.apollo.total)}% — alerta configurado em ${CONFIG.apollo_credit_alert_pct}%.` }, 250);
  }

  await push({ title: "Aguardando ciclo do Sales Navigator", detail: `Os contatos em <span class="mono">EM_VALIDACAO</span> só avançam depois que a validação oficial do LinkedIn escrever <span class="mono">li_notatcompany</span> no Dynamics (até 24h). Este código nunca acessa o LinkedIn — regra R6.4.`, pending: true }, 200);

  DB.runs.unshift({ at: now(), company: match.name, outcome: `<span class="chip chip--ok">concluído</span>`,
    candidates: pool.length, saved: created.length, credits: DB.quotas.apollo.used - credits0 });
  p.result = { company: match.name, contacts: created };
  p.running = false;
  render();
}

async function runSync() {
  const steps = [];
  syncReport = steps;
  const push = async (s) => { steps.push(s); render(); await sleep(380); };

  await push({ title: "Lendo contatos em EM_VALIDACAO", detail: `<span class="mono">GET /contacts?$filter=new_sdr_status eq 'EM_VALIDACAO'</span>` });

  const pend = byStatus("EM_VALIDACAO").slice();
  for (const c of pend) {
    DB.quotas.salesnav.used += 1;
    const hours = (now() - c.created_at) / HOUR;
    const facts = {
      "contact.not_at_company": c.not_at_company,
      "contact.crm_matched": c.crm_matched,
      "contact.hours_since_created": hours,
      "contact.replacement_suggested": c.replacement_suggested,
      "contact.stale_fields": c.stale_fields
    };
    const decisions = evaluate(facts).filter(d => d.matched);
    let newStatus = decisions.map(d => d.new_status).find(Boolean) || null;
    if (!newStatus && c.crm_matched && !c.not_at_company) newStatus = "VALIDADO";

    const applied = decisions.find(d => d.new_status);
    if (newStatus && transition(c, newStatus, applied ? applied.rule_id : "—")) {
      if (newStatus === "VALIDADO") c.validated_at = now();
    }

    for (const d of decisions) {
      if (d.actions.includes("create_task")) createTask("manual_match_review", c.id, d.rule_id);
      if (d.actions.includes("update_crm_fields")) {
        c.trace.push({ at: now(), rule: d.rule_id, text: `Campos desatualizados corrigidos a partir da validação: ${c.stale_fields.join(", ")}` });
        c.stale_fields = [];
        log("info", d.rule_id, `${c.first_name} ${c.last_name}: campos atualizados pela validação`);
      }
      if (d.actions.includes("create_contact_from_replacement")) {
        const co = company(c.company_id);
        const rep = addContact({
          company_id: c.company_id, first_name: "Roberto", last_name: "Yamada", title: c.title,
          email_status: "unavailable", email: null, linkedin_url: "linkedin.com/in/roberto.yamada",
          created_at: now(), status: "NOVO",
          trace: [{ at: now(), rule: d.rule_id, text: `Substituto sugerido pela validação do LinkedIn para ${c.first_name} ${c.last_name}` }]
        });
        c.replacement_suggested = false;
        log("info", d.rule_id, `Substituto criado em ${co.name}: Roberto Yamada`);
        await push({ rule: d.rule_id, title: `Substituto criado: Roberto Yamada`, tone: "accent", badge: "NOVO",
          detail: `O Sales Navigator sugeriu um substituto para ${esc(c.first_name)} ${esc(c.last_name)} em ${esc(co.name)}. Entra no pipeline como contato novo, do zero.` });
      }
    }

    const tone = newStatus === "VALIDADO" ? "ok" : newStatus === "INVALIDO_SAIU_EMPRESA" ? "bad" : newStatus ? "warn" : "";
    const corrigidos = decisions.some(d => d.actions.includes("update_crm_fields"))
      ? ` · <b>R4.4</b> corrigiu campos desatualizados a partir da validação` : "";
    await push({ rule: applied ? applied.rule_id : "—",
      title: `${c.first_name} ${c.last_name}`, tone, badge: newStatus || "sem mudança",
      detail: newStatus
        ? `<span class="mono">li_notatcompany=${c.not_at_company}</span> · <span class="mono">li_crmbadge=${c.crm_matched}</span> · ${Math.round(hours)}h no CRM → <span class="mono">${esc(newStatus)}</span>${corrigidos}`
        : `Sem match no Sales Navigator, mas ainda dentro da janela de ${CONFIG.match_timeout_hours}h. Permanece em validação.${corrigidos}` });
  }

  // Gate R5.1 sobre os VALIDADOS
  await push({ title: "Gate de cadência (R5.1)", detail: `Cada contato <span class="mono">VALIDADO</span> é reavaliado antes de entrar na fila.` });
  for (const c of byStatus("VALIDADO").slice()) {
    const facts = {
      "contact.status": "VALIDADO",
      "contact.email_status": c.email_status,
      "contact.not_at_company": c.not_at_company,
      "contact.days_since_validation": c.validated_at ? (now() - c.validated_at) / DAY : Infinity
    };
    const decisions = evaluate(facts);
    const gate = decisions.find(d => d.rule_id === "R5.1");
    if (gate && gate.matched) {
      transition(c, "EM_CADENCIA", "R5.1");
      await push({ rule: "R5.1", title: `${c.first_name} ${c.last_name}`, tone: "accent", badge: "EM_CADENCIA",
        detail: `E-mail <span class="mono">verified</span>, <span class="mono">not_at_company=false</span>, validação de ${Math.round(facts["contact.days_since_validation"])}d — dentro dos ${CONFIG.validation_freshness_days}d. Power Automate assume a partir daqui.` });
    } else {
      await push({ rule: "R5.1", title: `${c.first_name} ${c.last_name}`, tone: "bad", badge: "block_cadence",
        detail: `Gate reprovado. O ramo <span class="mono">else</span> bloqueia a cadência; nenhum e-mail é disparado.` });
    }
  }

  const q = checkQuotas();
  if (q.some(d => d.actions.includes("pause_pipeline"))) {
    await push({ rule: "R6.1", title: "Limite mensal do Sales Navigator atingido", tone: "bad", badge: "pause_pipeline",
      detail: `${DB.quotas.salesnav.used} de ${CONFIG.salesnav_monthly_update_limit} updates consumidos. Pipeline pausado até a virada do ciclo.` });
  }
  if (steps.length === 2) await push({ title: "Nada a fazer", detail: "Nenhum contato mudou de estado neste ciclo." });
  render();
}

function renderSimResult(decisions) {
  const fired = decisions.filter(d => d.matched);
  const gates = decisions.filter(d => !d.matched);
  const status = fired.map(d => d.new_status).find(Boolean);
  const from = simFacts["contact.status"];
  const allowed = status ? canTransition(from, status) : null;

  return `<div class="stack">
    ${status ? (allowed
      ? `<div class="notice notice--ok"><div><strong>Resultado:</strong> ${statusChip(from)} → ${statusChip(status)} — transição permitida pela máquina de estados.</div></div>`
      : `<div class="notice notice--bad"><div><strong>Transição bloqueada:</strong> ${esc(from)} → ${esc(status)} não está em <span class="mono">state_machine.transitions</span>. A ação da regra não é aplicada.</div></div>`)
      : `<div class="notice notice--info"><div><strong>Nenhuma mudança de estado.</strong> As regras disparadas não contêm <span class="mono">set_status</span>.</div></div>`}
    ${fired.length ? `<div class="stack">
      <div class="eyebrow">Regras disparadas</div>
      ${fired.map(d => `<div class="row">${ruleChip(d.rule_id)}<span class="mono dim">${d.actions.map(esc).join(" · ")}</span></div>`).join("")}
    </div>` : ""}
    ${gates.length ? `<div class="stack">
      <div class="eyebrow">Ramos else (gates reprovados)</div>
      ${gates.map(d => `<div class="row">${ruleChip(d.rule_id)}<span class="mono dim">${d.actions.map(esc).join(" · ")}</span></div>`).join("")}
    </div>` : ""}
  </div>`;
}

function drawStateMachine() {
  const el = document.getElementById("smDiagram");
  if (!el) return;
  const W = 160, H = 30;
  const chain = [["NOVO", 20], ["ENRIQUECIDO", 200], ["EM_VALIDACAO", 380], ["VALIDADO", 560], ["EM_CADENCIA", 740], ["RESPONDEU", 920]];
  const branch = [["EMPRESA_NAO_ENCONTRADA", 20], ["SEM_EMAIL", 200], ["REVISAO_MANUAL", 380], ["INVALIDO_SAIU_EMPRESA", 560], ["INVALIDO_BOUNCE", 740], ["SEM_RESPOSTA", 920]];
  const TONE = { ok: "var(--ok)", warn: "var(--warn)", bad: "var(--bad)", accent: "var(--accent)", "": "var(--ink-3)" };

  const box = (label, x, y) => {
    const tone = TONE[STATUS_META[label].tone];
    return `<g>
      <rect x="${x}" y="${y}" width="${W}" height="${H}" rx="5" style="fill:var(--surface-2);stroke:${tone};stroke-width:1.2"/>
      <text x="${x + W / 2}" y="${y + H / 2 + 3.5}" text-anchor="middle"
            style="font-family:var(--mono);font-size:10px;fill:${tone};letter-spacing:.5px">${label}</text>
    </g>`;
  };
  const stroke = "style=\"stroke:var(--line-2);stroke-width:1.2\"";
  const dashed = "style=\"stroke:var(--line-2);stroke-width:1.2;stroke-dasharray:3 3\"";
  const arrows = [];
  for (let i = 0; i < chain.length - 1; i++) {
    arrows.push(`<line x1="${chain[i][1] + W}" y1="39" x2="${chain[i + 1][1] - 4}" y2="39" ${stroke} marker-end="url(#ah)"/>`);
  }
  for (let i = 0; i < 5; i++) {
    const cx = chain[i][1] + W / 2;
    arrows.push(`<line x1="${cx}" y1="54" x2="${cx}" y2="136" ${dashed} marker-end="url(#ah)"/>`);
  }
  arrows.push(`<path d="M 870 54 L 870 95 L 1000 95 L 1000 136" marker-end="url(#ah)"
    style="fill:none;stroke:var(--line-2);stroke-width:1.2;stroke-dasharray:3 3"/>`);

  el.innerHTML = `<svg viewBox="0 0 1100 190" role="img" aria-label="Diagrama da máquina de estados do contato">
    <defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" style="fill:var(--line-2)"/>
    </marker></defs>
    ${arrows.join("")}
    ${chain.map(([l, x]) => box(l, x, 24)).join("")}
    ${branch.map(([l, x]) => box(l, x, 140)).join("")}
    <text x="20" y="128" style="font-family:var(--mono);font-size:9px;fill:var(--ink-3);letter-spacing:1.2px">TERMINAIS</text>
  </svg>`;
}

/* O gate só é uma reprovação para quem ainda está a caminho da cadência.
   Para quem já passou (ou já saiu por outra regra), explica o estado real. */
function gateVerdict(c, gate) {
  if (["EM_CADENCIA", "RESPONDEU", "SEM_RESPOSTA"].includes(c.status))
    return `<div class="notice notice--ok"><div>Já aprovado no gate — o contato entrou na fila de cadência${c.status !== "EM_CADENCIA" ? ` e hoje está em <span class="mono">${esc(c.status)}</span>` : ""}.</div></div>`;
  if (c.status.startsWith("INVALIDO") || c.status === "SEM_EMAIL" || c.status === "REVISAO_MANUAL")
    return `<div class="notice notice--bad"><div>Fora do funil em <span class="mono">${esc(c.status)}</span>. O gate não se aplica: o contato não volta à cadência sem intervenção humana.</div></div>`;
  if (gate && gate.matched)
    return `<div class="notice notice--ok"><div>Todas as condições atendidas. O contato pode entrar em <span class="mono">EM_CADENCIA</span> no próximo sync.</div></div>`;
  return `<div class="notice notice--warn"><div><strong>Ainda não elegível.</strong> ${gateBlockReason(c, {
    "contact.status": c.status, "contact.email_status": c.email_status,
    "contact.not_at_company": c.not_at_company,
    "contact.days_since_validation": c.validated_at ? (now() - c.validated_at) / DAY : Infinity
  })}</div></div>`;
}

function gateBlockReason(c, facts) {
  const fails = RULES.find(r => r.id === "R5.1").when.filter(cond => !checkCond(cond, facts));
  const map = {
    "contact.email_status": "o e-mail não está <span class=\"mono\">verified</span>",
    "contact.not_at_company": "o LinkedIn marcou <span class=\"mono\">Not At Company</span>",
    "contact.days_since_validation": `a validação tem mais de ${CONFIG.validation_freshness_days} dias`,
    "contact.status": `o estado atual é <span class="mono">${esc(c.status)}</span>, não <span class="mono">VALIDADO</span>`
  };
  return "Falha em: " + fails.map(f => map[f.field]).join("; ") + ".";
}

function fireEvent(type, targetId) {
  const consoleEl = document.getElementById("eventConsole");
  const lines = [];

  let target = targetId ? contact(targetId) : null;
  if (!target && ["reply_received", "email_bounced", "opt_out_received"].includes(type)) {
    target = byStatus("EM_CADENCIA")[0];
  }

  const facts = { "event.type": type, "event.actor": "robot" };
  const decisions = evaluate(facts).filter(d => d.matched);

  lines.push(`<i>${clock(now())}</i> evento <b>${esc(type)}</b>${target ? ` · alvo ${esc(target.first_name)} ${esc(target.last_name)}` : ""}`);

  if (!decisions.length) {
    lines.push(`<i>nenhuma regra correspondeu</i>`);
  }

  for (const d of decisions) {
    lines.push(`<b>${d.rule_id}</b> → ${d.actions.join(", ")}`);

    if (d.actions.includes("reject_event")) {
      const level = d.rule_id === "R6.4" ? "critical" : "error";
      log(level, d.rule_id, `Evento ${type} rejeitado pelo motor de regras`);
      lines.push(d.rule_id === "R6.4"
        ? `<i>bloqueado — acesso não-oficial ao LinkedIn é proibido pela arquitetura</i>`
        : `<i>bloqueado — o valor Ignore só pode ser definido por uma pessoa</i>`);
      continue;
    }

    if (target && d.new_status) {
      if (transition(target, d.new_status, d.rule_id)) {
        lines.push(`<i>${esc(target.first_name)} ${esc(target.last_name)} → ${d.new_status}</i>`);
      } else {
        lines.push(`<i>transição ${target.status} → ${d.new_status} bloqueada pela máquina de estados</i>`);
      }
    }
    if (target && d.actions.includes("set_field")) {
      target.do_not_contact = true;
      target.trace.push({ at: now(), rule: d.rule_id, text: "do_not_contact = true (opt-out LGPD)" });
      lines.push(`<i>do_not_contact = true</i>`);
    }
    if (target && d.actions.includes("remove_from_cadence") && !d.new_status) {
      target.trace.push({ at: now(), rule: d.rule_id, text: "Removido da cadência" });
      lines.push(`<i>removido da fila de cadência</i>`);
    }
    if (target && d.actions.includes("create_task")) {
      const spec = d.raw.find(a => a.action === "create_task");
      createTask(spec.type, target.id, d.rule_id, spec.sla_hours);
      lines.push(`<i>tarefa ${spec.type}${spec.sla_hours ? ` · SLA ${spec.sla_hours}h` : ""}</i>`);
    }
    if (d.actions.includes("notify")) lines.push(`<i>notificação enviada ao Teams</i>`);
  }

  render();
  const el = document.getElementById("eventConsole");
  if (el) el.innerHTML = lines.join("\n");
  else if (consoleEl) consoleEl.innerHTML = lines.join("\n");
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-view], [data-goto], [data-contact], [data-event], [data-fill], [data-confirm], [data-done], #runProspect, #clearProspect, #runSync, #runSim, #applyR32, #closeDrawer");
  if (!t) return;

  if (t.dataset.view) return go(t.dataset.view);
  if (t.dataset.goto) return go(t.dataset.goto);
  if (t.id === "closeDrawer") return closeDrawer();

  if (t.dataset.event) {
    e.stopPropagation();
    return fireEvent(t.dataset.event, t.dataset.target || null);
  }
  if (t.dataset.contact) return openDrawer(t.dataset.contact);
  if (t.dataset.fill) {
    prospectState.input = t.dataset.fill;
    prospectState.steps = []; prospectState.result = null; prospectState.pending = null;
    return render();
  }
  if (t.id === "runProspect") {
    const name = ($("#companyInput").value || "").trim();
    if (!name) return;
    prospectState.input = name;
    return runProspect(name);
  }
  if (t.dataset.confirm != null) {
    const p = prospectState.pending;
    prospectState.pending = null;
    if (t.dataset.confirm === "cancel") { prospectState.steps = []; return render(); }
    const chosen = p.matches[Number(t.dataset.confirm)];
    log("info", "R1.1", `Domínio confirmado por operador: ${chosen.domain}`);
    return runProspect(chosen.name, chosen);
  }
  if (t.id === "clearProspect") {
    prospectState = { input: prospectState.input, steps: [], running: false, pending: null, result: null };
    return render();
  }
  if (t.id === "runSync") return runSync();
  if (t.id === "runSim") {
    simResult = evaluate(Object.fromEntries(Object.entries(simFacts).filter(([, v]) => v !== "—")));
    return render();
  }
  if (t.id === "applyR32") {
    for (const c of DB.contacts.filter(x => x.email_status === "guessed" && (now() - x.enriched_at) / DAY > CONFIG.guessed_email_ttl_days)) {
      c.trace.push({ at: now(), rule: "R3.2", text: `Descartado: e-mail guessed sem confirmação em ${CONFIG.guessed_email_ttl_days} dias` });
      log("info", "R3.2", `${c.first_name} ${c.last_name} descartado (guessed além da janela)`);
      DB.contacts = DB.contacts.filter(x => x.id !== c.id);
    }
    return render();
  }
  if (t.dataset.done) {
    const task = DB.tasks.find(x => x.id === t.dataset.done);
    if (task) { task.done = true; log("info", task.rule, `Tarefa ${task.type} concluída`); }
    return render();
  }
});

document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.id === "pipelineFilter") { pipelineFilter = el.value; return render(); }
  if (el.id === "logFilter") { logFilter = el.value; return render(); }
  if (el.dataset.sim) {
    const raw = el.value;
    simFacts[el.dataset.sim] = el.type === "number" ? Number(raw)
      : raw === "true" ? true : raw === "false" ? false : raw;
    return;
  }
  if (el.dataset.cfg) {
    CONFIG[el.dataset.cfg] = Number(el.value);
    DB.quotas.salesnav.limit = CONFIG.salesnav_monthly_update_limit;
    log("info", "—", `Parâmetro ${el.dataset.cfg} alterado para ${el.value}`);
    return render();
  }
});

document.addEventListener("input", (e) => {
  if (e.target.id === "companyInput") prospectState.input = e.target.value;
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && drawerContact) closeDrawer();
  if (e.key === "Enter" && document.activeElement && document.activeElement.id === "companyInput") {
    const name = document.activeElement.value.trim();
    if (name && !prospectState.running) runProspect(name);
  }
});

$("#scrim").addEventListener("click", closeDrawer);

seed();
go("painel");
</script>
